<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>HubMI – logowanie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
*{box-sizing:border-box}
a{color:#1F3A8A;text-underline-offset:3px}a:hover{color:#172C6B}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #1F3A8A;outline-offset:2px}
.h{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.625}
.lbl{font-size:15px;font-weight:700;color:#4B5565}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:10px;font:inherit;font-size:17px;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-p{background:#1F3A8A;color:#fff}.btn-p:hover{background:#172C6B;color:#fff}
.btn-s{background:#fff;color:#1F3A8A;border-color:#1F3A8A}.btn-s:hover{background:#E8EDFA;color:#172C6B}
.card{background:#fff;border:1px solid #D9DDE4;border-radius:14px}
.muted{color:#4B5565}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
label{font-weight:700}
input{font:inherit;font-size:18px;line-height:28px;padding:12px 14px;border:1px solid #6B7487;border-radius:10px;background:#fff;color:#151A23;width:100%}
.acc{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid #D9DDE4;border-radius:10px;background:#fff;text-decoration:none;color:#151A23;min-height:64px;width:100%;font:inherit;text-align:left;cursor:pointer}
.pw{position:absolute;right:4px;top:4px;bottom:4px;min-width:44px;padding:0 14px;border:1px solid transparent;border-radius:10px;background:#E8EDFA;color:#1F3A8A;font:inherit;font-size:16px;line-height:24px;font-weight:700;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.acc:hover{border-color:#1F3A8A;background:#F3F6FD;color:#151A23}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 40px;color:#FFFFFF}
</style>
</helmet>
<div style="font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; color: #151A23; background: #F6F7F9; font-size: 18px; line-height: 1.625">
  <dc-import name="Naglowek" rola="gosc" active="" hint-size="100%,112px"></dc-import>
  <main id="main-content" class="wrap" style="padding-top: 56px; padding-bottom: 72px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 32px">
    <section class="card" role="region" aria-labelledby="zaloguj" style="width: 100%; max-width: 480px; padding: 40px; display: flex; flex-direction: column; gap: 22px">
      <h1 id="zaloguj" class="h" style="font-size: 34px">Zaloguj się</h1>
      <form novalidate style="display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="l-mail">Adres e-mail<span class="muted" style="font-weight: 400"> (wymagane)</span></label><input id="l-mail" type="email" autocomplete="email" required></div>
        <div style="position: relative">
          <a href="#reset-hasla" style="position: absolute; top: -10px; right: 0; display: inline-flex; align-items: center; min-height: 44px; font-size: 16px">Nie pamiętasz hasła?</a>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="l-haslo">Hasło<span class="muted" style="font-weight: 400"> (wymagane)</span></label><div style="position: relative"><input id="l-haslo" type="password" autocomplete="current-password" required style="padding-right: 112px"><button type="button" class="pw" aria-controls="l-haslo">Pokaż<span class="sr-only"> hasło</span></button></div></div>
        </div>
        <button type="submit" class="btn btn-p" style="width: 100%">Zaloguj</button>
      </form>
      <p style="text-align: center; border-top: 1px solid #D9DDE4; padding-top: 20px">Nie masz konta? <a href="Rejestracja.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700">Załóż konto</a></p>
    </section>
    <section aria-labelledby="demo-a" style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="demo-a" class="h" style="font-size: 28px">Wersja pokazowa: wejdź jako…</h2>
      <p class="muted">Fikcyjne osoby i instytucje. Kliknij jedną z nich, żeby wejść bez hasła.</p>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <li><button type="button" class="acc"><span class="av" aria-hidden="true" style="background: #1F3A8A">S</span><span style="display: flex; flex-direction: column; line-height: 1.375"><strong>Stanisław</strong><span class="muted" style="font-size: 16px; line-height: 1.5">mieszkaniec, opiekuje się chorą mamą</span></span></button></li>
        <li><button type="button" class="acc"><span class="av" aria-hidden="true" style="background: #1D6B48">G</span><span style="display: flex; flex-direction: column; line-height: 1.375"><strong>GOPS w Przykładowej Woli</strong><span class="muted" style="font-size: 16px; line-height: 1.5">ośrodek pomocy społecznej w gminie wiejskiej</span></span></button></li>
        <li><button type="button" class="acc"><span class="av" aria-hidden="true" style="background: #C2452B">F</span><span style="display: flex; flex-direction: column; line-height: 1.375"><strong>Fundacja Dobry Start</strong><span class="muted" style="font-size: 16px; line-height: 1.5">organizacja pozarządowa, autorka pomysłu</span></span></button></li>
        <li><button type="button" class="acc"><span class="av" aria-hidden="true" style="background: #4B5565">E</span><span style="display: flex; flex-direction: column; line-height: 1.375"><strong>Ewa</strong><span class="muted" style="font-size: 16px; line-height: 1.5">ekspertka, mentorka innowacji</span></span></button></li>
        <li><button type="button" class="acc"><span class="av" aria-hidden="true" style="background: #151A23">R</span><span style="display: flex; flex-direction: column; line-height: 1.375"><strong>Redakcja ROPS</strong><span class="muted" style="font-size: 16px; line-height: 1.5">administracja ROPS, pełny dostęp do Panelu ROPS</span></span></button></li>
      </ul>
    </section>
  </main>
  <dc-import name="Stopka" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
