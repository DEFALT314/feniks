<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>HubMI – profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
*{box-sizing:border-box}
a{color:#1F3A8A;text-underline-offset:3px}a:hover{color:#172C6B}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #C2452B;outline-offset:2px}
.h{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:10px;font:inherit;font-size:17px;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-p{background:#1F3A8A;color:#fff}
.btn-s{background:#fff;color:#1F3A8A;border-color:#1F3A8A}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700;background:#EEF0F4;color:#4B5565}
.tag-warn{background:#FFF1DB;color:#8A4B00}
.tag-err{background:#FDECEA;color:#B42318}
.muted{color:#4B5565}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.th{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-bottom:1px solid #D9DDE4;text-decoration:none;color:#151A23}
.th:hover{background:#F3F6FD;color:#151A23}
.msg{display:flex;flex-direction:column;gap:4px;padding:16px 0;border-bottom:1px solid #EEF0F4}
label{font-weight:700}
textarea{font:inherit;font-size:18px;padding:12px 14px;border:1px solid #6B7487;border-radius:10px;background:#fff;color:#151A23;width:100%}
.card{background:#fff;border:1px solid #D9DDE4;border-radius:12px}
.lbl{font-size:15px;font-weight:700;color:#4B5565}
input{font:inherit;font-size:18px;padding:12px 14px;border:1px solid #6B7487;border-radius:10px;background:#fff;color:#151A23;width:100%}
.opt{display:flex;gap:12px;align-items:center;padding:12px 16px;border:1px solid #D9DDE4;border-radius:10px;font-weight:400}
.opt input{width:22px;height:22px;accent-color:#1F3A8A;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid #EEF0F4;flex-wrap:wrap}
</style>
</helmet>
<div style="font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; color: #151A23; background: #F6F7F9; font-size: 18px; line-height: 1.6">
  <dc-import name="Naglowek" active="profil" rola="mieszkaniec" kto="Stanisław" hint-size="100%,112px"></dc-import>
  <main class="wrap" style="max-width: 820px; padding-top: 40px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 24px">
    <h1 class="h" style="font-size: 40px">Twój profil</h1>
    <section class="card" aria-labelledby="konto" style="padding: 28px 32px; display: flex; flex-direction: column; gap: 6px">
      <h2 id="konto" class="h" style="font-size: 24px; margin-bottom: 8px">Konto</h2>
      <form style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px">
        <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 320px"><label for="p-nazwa" style="font-weight:700">Jak mamy Cię nazywać</label><input id="p-nazwa" value="Stanisław"></div>
        <button type="submit" class="btn btn-s">Zapisz</button>
      </form>
      <div class="row"><span class="muted">Adres e-mail</span><strong>stanislaw@example.org</strong></div>
      <div class="row"><span class="muted">Rola</span><span class="tag">Mieszkaniec</span></div>
    </section>
    <section class="card" aria-labelledby="rola" style="padding: 28px 32px; display: flex; flex-direction: column; gap: 14px">
      <h2 id="rola" class="h" style="font-size: 24px">Działasz w imieniu instytucji?</h2>
      <p class="muted">Organizacje, gminy i eksperci mają dodatkowe narzędzia, np. kartę usługi dla gminy. Rolę zatwierdza ROPS.</p>
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend class="sr-only">Rola, o którą prosisz</legend>
        <label class="opt"><input type="radio" name="r"> Organizacja pozarządowa</label>
        <label class="opt"><input type="radio" name="r"> Gmina lub instytucja publiczna</label>
        <label class="opt"><input type="radio" name="r"> Ekspertka lub ekspert</label>
      </fieldset>
      <button type="button" class="btn btn-s" style="align-self: flex-start">Wyślij prośbę do ROPS</button>
    </section>
    <section class="card" aria-labelledby="bezp" style="padding: 28px 32px; display: flex; flex-direction: column; gap: 14px">
      <h2 id="bezp" class="h" style="font-size: 24px">Bezpieczeństwo</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <a class="btn btn-s" href="#haslo">Zmień hasło</a>
        <button type="button" class="btn btn-p">Wyloguj się</button>
      </div>
    </section>
  </main>
  <dc-import name="Stopka" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
