<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>HubMI – Karta usługi – stany</title>
<script src="./support.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="./ruch.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
*{box-sizing:border-box}
a{color:#1F3A8A;text-underline-offset:3px}a:hover{color:#172C6B}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #1F3A8A;outline-offset:2px}
.h{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.lbl{font-size:15px;font-weight:700;color:#4B5565}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:10px;font:inherit;font-size:17px;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-p{background:#1F3A8A;color:#fff}
.btn-s{background:#fff;color:#1F3A8A;border-color:#1F3A8A}
.card{background:#fff;border:1px solid #D9DDE4;border-radius:12px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:700;background:#EEF0F4;color:#4B5565}
.tag-ai{background:#E8EDFA;color:#1F3A8A}
.tag-ok{background:#E3F2EA;color:#1D6B48}
.muted{color:#4B5565}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
label{font-weight:700}
input,textarea,select{font:inherit;font-size:18px;padding:12px 14px;border:1px solid #6B7487;border-radius:10px;background:#fff;color:#151A23;width:100%}
.sec{padding:20px 0;border-top:1px solid #D9DDE4;display:flex;flex-direction:column;gap:6px}
.sec h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;font-weight:700;letter-spacing:-.01em}
.req{font-weight:400;color:#4B5565}
.num{display:flex;flex-shrink:0;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid #1F3A8A;color:#1F3A8A;font-size:13px;font-weight:700}
.fact{display:flex;flex-direction:column;gap:6px;border-top:1px solid #D9DDE4;padding-top:16px}
.blank{background:#FFF1DB;color:#8A4B00;padding:0 6px;border-radius:4px;font-weight:700}
/* Ruch i stany – wspólne dla wszystkich ekranów (w aplikacji: tokeny w globals.css) */
:root{--ruch-szybko:120ms;--ruch:200ms;--ruch-wolno:420ms;--ease:cubic-bezier(.16,1,.3,1)}
html{scrollbar-color:#B8C0CD #F6F7F9;caret-color:#1F3A8A}
::selection{background:#FFE08A;color:#151A23}
a{text-decoration-thickness:1px;transition:color var(--ruch) var(--ease),text-underline-offset var(--ruch) var(--ease),text-decoration-color var(--ruch) var(--ease)}
a:hover{text-underline-offset:5px}
.arr{display:inline-block;margin-left:.3em;transition:transform var(--ruch) var(--ease)}
a:hover .arr{transform:translateX(4px)}
.btn{transition:background-color var(--ruch) var(--ease),border-color var(--ruch) var(--ease),color var(--ruch) var(--ease),box-shadow var(--ruch) var(--ease),transform var(--ruch-szybko) var(--ease)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-p:hover{background:#172C6B;color:#fff;box-shadow:0 2px 8px -2px rgba(23,44,107,.35)}
.btn-s:hover{background:#E8EDFA;color:#172C6B}
.btn-t:hover{color:#172C6B;text-underline-offset:5px}
.btn-d:hover{background:#FDECEA;color:#912018}
a.card{transition:border-color var(--ruch) var(--ease),box-shadow var(--ruch) var(--ease)}
a.card:hover{border-color:#8A99C7;box-shadow:0 8px 20px -10px rgba(21,26,35,.22)}
input:not([type=radio]):not([type=checkbox]),textarea,select{transition:border-color var(--ruch) var(--ease),box-shadow var(--ruch) var(--ease)}
input:not([type=radio]):not([type=checkbox]):hover,textarea:hover,select:hover{border-color:#4B5565}
input:not([type=radio]):not([type=checkbox]):focus,textarea:focus,select:focus{outline:none;border-color:#1F3A8A;box-shadow:0 0 0 1px #1F3A8A,0 0 0 5px rgba(31,58,138,.18)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-property:color,background-color,border-color,box-shadow,text-decoration-color!important}
  .btn:active{transform:none}
}
</style>
</helmet>
<div style="font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; color: #151A23; background: #F6F7F9; font-size: 18px; line-height: 1.6; min-height: 100%">
  <main class="wrap" style="padding-top: 56px; display: flex; flex-direction: column; gap: 40px">
    <h1 class="h" style="font-size: 32px">Karta usługi – stany</h1>
    <section aria-labelledby="stan-ai" style="display: flex; flex-direction: column; gap: 12px">
      <h2 id="stan-ai" class="lbl">Asystent AI niedostępny</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="color: #B42318; font-weight: 700">Asystent AI jest teraz niedostępny. Spróbuj później.</p>
        <p>W tym czasie możesz <a href="Karta.dc.html">przeczytać kartę wybranej innowacji</a> albo <a href="Wiadomosci.dc.html">zapytać o nią ROPS</a>.</p>
      </div>
    </section>

    <section aria-labelledby="stan-wyslano" style="display: flex; flex-direction: column; gap: 12px">
      <h2 id="stan-wyslano" class="lbl">Wysłano do ROPS</h2>
      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 360px">
        <p style="color: #1D6B48; font-weight: 700">Wysłano do ROPS. Odpowiedź zobaczysz w Wiadomościach.</p>
        <button type="button" class="btn btn-s">Drukuj albo zapisz jako PDF</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
